name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json version
        run: |
          [ "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" ] \
            || { echo "Tag $GITHUB_REF_NAME does not match package.json version"; exit 1; }
      - run: npm run lint
      - run: npm test
      - name: Build Chrome and Firefox packages
        run: |
          npm run build
          npm run build:firefox
          (cd dist && zip -qr "../mashinted-${GITHUB_REF_NAME}-chrome.zip" .)
          (cd dist-firefox && zip -qr "../mashinted-${GITHUB_REF_NAME}-firefox.zip" .)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" \
            mashinted-*-chrome.zip mashinted-*-firefox.zip
